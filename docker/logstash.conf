input {
  beats {
    port => 5000
  }
}

filter {
  json {
    source => "message"
  }

  date {
    match => ["eventTime", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    add_field => {
      "log_type" => "cloudtrail"
    }
  }

  if [eventName] == "ConsoleLogin" and [errorCode] == "Failure" {
    mutate {
      add_field => {
        "severity" => "high"
        "threat_type" => "brute_force"
      }
    }
  }

  if [eventName] in ["AttachUserPolicy", "AttachRolePolicy", "AttachGroupPolicy", "PutUserPolicy"] {
    mutate {
      add_field => {
        "severity" => "critical"
        "threat_type" => "privilege_escalation"
      }
    }
  }

  if [userIdentity][type] == "Root" {
    mutate {
      add_field => {
        "severity" => "critical"
        "threat_type" => "root_usage"
      }
    }
  }

  if [eventName] in ["AuthorizeSecurityGroupIngress", "RevokeSecurityGroupIngress"] {
    mutate {
      add_field => {
        "severity" => "medium"
        "threat_type" => "security_group_change"
      }
    }
  }

  if [eventName] in ["GetObject", "ListBucket"] {
    mutate {
      add_field => {
        "severity" => "medium"
        "threat_type" => "data_access"
      }
    }
  }

  if [eventName] in ["RunInstances", "TerminateInstances", "StopInstances"] {
    mutate {
      add_field => {
        "severity" => "medium"
        "threat_type" => "instance_change"
      }
    }
  }

  if [eventName] in ["CreateUser", "CreateAccessKey", "DeleteUser"] {
    mutate {
      add_field => {
        "severity" => "high"
        "threat_type" => "iam_change"
      }
    }
  }

  if [sourceIPAddress] {
    geoip {
      source => "sourceIPAddress"
      target => "geoip"
    }
  }

  mutate {
    remove_field => ["host", "agent", "ecs", "log", "input"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cloudsoc-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
